## Thin caller. The job itself lives in PredictiveEcology/actions, so the action
## pins move once there rather than being frozen into this repository on the day
## the file was generated.
##
## The file this replaces asked for `runs-on: ubuntu-20.04`, a runner image GitHub
## has retired. A job requesting a retired label queues indefinitely instead of
## failing, so every run on this repository sat pending and no check ever reported
## -- which is how a pull request here could neither pass nor fail.
##
## It also pinned install-Require, install-SpaDES and install-Rmd-pkgs at @v0.0.1,
## among the pins that block retiring those tags (PredictiveEcology/actions#36),
## and carried a GitTag for a 2022 Require commit.
##
## No `extra-apt` is needed. Of the ten system packages the old file installed by
## hand, six (libcurl4-openssl-dev, libgit2-dev, libglpk-dev, libmagick++-dev,
## libxml2-dev, python3-gdal) are the called workflow's default set, and the other
## four (libgdal-dev, libgeos-dev, libproj-dev, libudunits2-dev) come from
## install-spatial-deps, which it runs by default. The called workflow also wraps
## apt in retries and timeouts that a bare `sudo apt-get install` did not have.
##
## The old "Install additional packages" step installed LandR by hand. The called
## workflow installs the module's own reqdPkgs, which already names
## PredictiveEcology/LandR, so that step has no remaining purpose.
##
## `master` is dropped from the triggers: this repository has only main and
## development.
##
## Matches the already-migrated Biomass_core and Biomass_borealDataPrep.

name: Render module Rmd

on:
  pull_request:
    branches:
      - main
      - development
  push:
    branches:
      - main
      - development
    paths:
      - .github/workflows/render-module-rmd.yaml
      - Biomass_validationKNN.Rmd
      - Biomass_validationKNN.R
  workflow_dispatch:

jobs:
  render-module-rmd:
    ## The called workflow splits `render` (contents: read, which installs and then
    ## executes this module's own code) from `commit` (contents: write, which runs
    ## nothing but git). A called workflow can only reduce what is granted here,
    ## never widen it, so the write scope has to be granted at the call site.
    permissions:
      contents: write
    uses: PredictiveEcology/actions/.github/workflows/render-module-rmd.yaml@main
    with:
      module: Biomass_validationKNN
